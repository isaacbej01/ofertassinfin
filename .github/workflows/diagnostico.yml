name: Diagnóstico

# Corre el chequeo completo del sistema desde GitHub, con un botón.
# Actions → Diagnóstico → Run workflow.
#
# No hace falta tener Python instalado en tu computadora: esto corre en los
# servidores de GitHub, gratis, y te deja el resultado en el log.
#
# OJO: este repo es público, así que su log también lo es. GitHub enmascara
# automáticamente cualquier valor guardado como secret (sale como ***), y el
# diagnóstico está escrito para no imprimir credenciales completas.

on:
  workflow_dispatch:

concurrency:
  # El diagnóstico también pide un access token, y pedirlo rota el refresh
  # token de ML. Comparte fila con la corrida diaria para que nunca coincidan.
  group: ml-token
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Revisar cada pieza
        id: doc
        continue-on-error: true
        env:
          ML_CLIENT_ID:          ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET:      ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN:      ${{ secrets.ML_REFRESH_TOKEN }}
          ML_AFFILIATE_TAG:      ${{ secrets.ML_AFFILIATE_TAG }}
          AMZ_PARTNER_TAG:       ${{ secrets.AMZ_PARTNER_TAG }}
          AMZ_CREDENTIAL_ID:     ${{ secrets.AMZ_CREDENTIAL_ID }}
          AMZ_CREDENTIAL_SECRET: ${{ secrets.AMZ_CREDENTIAL_SECRET }}
          BUFFER_ACCESS_TOKEN:   ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_IG:     ${{ secrets.BUFFER_CHANNEL_IG }}
          BUFFER_CHANNEL_TIKTOK: ${{ secrets.BUFFER_CHANNEL_TIKTOK }}
          MEDIA_BASE_URL:        ${{ secrets.MEDIA_BASE_URL }}
          ML_TOKEN_FILE:         ${{ runner.temp }}/ml_refresh.txt
        run: python scripts/doctor.py | tee salud.txt

      - name: Persistir el refresh token de ML si rotó
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          f="${{ runner.temp }}/ml_refresh.txt"
          if [ ! -s "$f" ]; then
            echo "El refresh token no rotó en esta corrida."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ML rotó el refresh token y no hay GH_PAT para guardarlo. La corrida diaria va a fallar."
            exit 1
          fi
          gh secret set ML_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$f"
          echo "🔄 ML_REFRESH_TOKEN actualizado automáticamente."

      - name: Dejar el resultado a la vista
        if: always()
        run: |
          {
            echo "## Diagnóstico — $(TZ=America/Mexico_City date '+%d/%m/%Y %H:%M')"
            echo ""
            echo '```'
            cat salud.txt 2>/dev/null || echo "el diagnóstico no llegó a correr"
            echo '```'
            echo ""
            echo "Los valores guardados como secret aparecen como \`***\`: GitHub los oculta solo."
          } >> "$GITHUB_STEP_SUMMARY"

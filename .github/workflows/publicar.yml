name: Publicar ofertas

on:
  schedule:
    # Cada 3 horas dentro de la franja despierta de México (UTC-6):
    #   15 UTC = 09:00 · 18 = 12:00 · 21 = 15:00 · 00 = 18:00 · 03 = 21:00
    # Una oferta por corrida. Así siempre hay algo reciente en el perfil, las
    # ofertas relámpago no se publican muertas, y los posts no se estorban.
    - cron: "0 0,3,15,18,21 * * *"
  workflow_dispatch:
    inputs:
      n:
        description: "Cuántos posts generar"
        required: false
        default: "1"
      dry_run:
        description: "Generar sin publicar en Buffer"
        type: boolean
        default: false

concurrency:
  # ML invalida su refresh token en cada uso y entrega uno nuevo. Dos corridas
  # simultáneas se lo pisarían y habría que reautorizar a mano: por eso todos
  # los workflows que tocan ML comparten este grupo y hacen fila.
  group: ml-token
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # FASE 1: descubre, elige y dibuja. No toca Buffer.
      - name: Generar creativos
        id: pipeline
        env:
          ML_CLIENT_ID:        ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET:    ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN:    ${{ secrets.ML_REFRESH_TOKEN }}
          ML_AFFILIATE_TAG:    ${{ secrets.ML_AFFILIATE_TAG }}
          ML_SESSION_COOKIE:   ${{ secrets.ML_SESSION_COOKIE }}
          AMZ_PARTNER_TAG:     ${{ secrets.AMZ_PARTNER_TAG }}
          AMZ_CREDENTIAL_ID:   ${{ secrets.AMZ_CREDENTIAL_ID }}
          AMZ_CREDENTIAL_SECRET: ${{ secrets.AMZ_CREDENTIAL_SECRET }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_IG:   ${{ secrets.BUFFER_CHANNEL_IG }}
          BUFFER_CHANNEL_TIKTOK: ${{ secrets.BUFFER_CHANNEL_TIKTOK }}
          MEDIA_BASE_URL:      ${{ secrets.MEDIA_BASE_URL }}
          ML_TOKEN_FILE:       ${{ runner.temp }}/ml_refresh.txt
        run: |
          python -m src.pipeline --fase generar \
            -n "${{ github.event.inputs.n || 1 }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            2>&1 | tee corrida.log

      # Va inmediatamente después del pipeline y con `always()` a propósito:
      # si el token rotó y algo posterior falla, perder este paso significa
      # quedarse sin acceso a ML hasta reautorizar a mano.
      - name: Persistir el refresh token de ML si rotó
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          f="${{ runner.temp }}/ml_refresh.txt"
          if [ ! -s "$f" ]; then
            echo "El refresh token no rotó en esta corrida."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ML rotó el refresh token y no hay GH_PAT para guardarlo. La próxima corrida va a fallar."
            exit 1
          fi
          gh secret set ML_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$f"
          echo "🔄 ML_REFRESH_TOKEN actualizado automáticamente." >> "$GITHUB_STEP_SUMMARY"

      - name: Limpiar imágenes viejas
        run: |
          # Buffer descarga la imagen AL PUBLICAR, no al programar.
          # Guardamos 10 días para cubrir cualquier post en cola.
          find docs/media -name '*.png' -mtime +10 -delete 2>/dev/null || true

      - name: Subir creativos a GitHub Pages
        run: |
          git config user.name  "ofertas-sin-fin-bot"
          git config user.email "actions@github.com"
          git add data/ docs/ || true
          git diff --staged --quiet || git commit -m "🤖 creativos $(date -u +%Y-%m-%dT%H:%M)"
          git push

      # Buffer valida la imagen al CREAR el post, no al publicarlo: si la URL
      # todavía no responde, rechaza con "Image could not be read from its
      # URL". Pages tarda entre 20 s y 2 min en servir lo recién commiteado,
      # así que aquí se espera a que la imagen exista de verdad.
      - name: Esperar a que Pages sirva las imágenes
        if: github.event.inputs.dry_run != 'true'
        env:
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
        run: |
          archivo=$(ls -t docs/media/*.png 2>/dev/null | head -1 | xargs -r basename)
          if [ -z "$archivo" ]; then
            echo "No se generaron creativos en esta corrida."; exit 0
          fi
          url="${MEDIA_BASE_URL%/}/$archivo"
          echo "Esperando a $archivo"
          for i in $(seq 1 40); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" -L "$url")
            if [ "$codigo" = "200" ]; then
              echo "Pages responde 200 tras $((i*10)) s."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Pages no sirvió la imagen tras 400 s. No se publica: "\
               "Buffer la rechazaría y el post saldría sin foto."
          exit 1

      # FASE 2: recién ahora las URLs existen y Buffer las puede leer.
      - name: Publicar en Buffer
        if: github.event.inputs.dry_run != 'true'
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_IG:   ${{ secrets.BUFFER_CHANNEL_IG }}
          BUFFER_CHANNEL_TIKTOK: ${{ secrets.BUFFER_CHANNEL_TIKTOK }}
          MEDIA_BASE_URL:      ${{ secrets.MEDIA_BASE_URL }}
        run: python -m src.pipeline --fase publicar 2>&1 | tee -a corrida.log

      - name: Commit de estado y link-in-bio
        if: always()
        run: |
          git config user.name  "ofertas-sin-fin-bot"
          git config user.email "actions@github.com"
          git pull --rebase -q || true
          git add data/ docs/ || true
          git diff --staged --quiet || git commit -m "🤖 publicado $(date -u +%Y-%m-%dT%H:%M)"
          git push

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Corrida $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo '```'
            tail -25 corrida.log 2>/dev/null || echo "sin log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

name: Publicar ofertas

on:
  schedule:
    # 08:00 hora del centro de México (UTC-6) = 14:00 UTC.
    # Una sola corrida diaria que descubre y PROGRAMA los posts del día
    # en Buffer con sus horarios. Menos corridas = menos minutos de Actions
    # y menos riesgo de duplicados.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      n:
        description: "Cuántos posts generar"
        required: false
        default: "4"
      dry_run:
        description: "Generar sin publicar en Buffer"
        type: boolean
        default: false

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar pipeline
        id: pipeline
        env:
          ML_CLIENT_ID:        ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET:    ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN:    ${{ secrets.ML_REFRESH_TOKEN }}
          ML_AFFILIATE_TAG:    ${{ secrets.ML_AFFILIATE_TAG }}
          ML_SESSION_COOKIE:   ${{ secrets.ML_SESSION_COOKIE }}
          AMZ_PARTNER_TAG:     ${{ secrets.AMZ_PARTNER_TAG }}
          AMZ_CREDENTIAL_ID:   ${{ secrets.AMZ_CREDENTIAL_ID }}
          AMZ_CREDENTIAL_SECRET: ${{ secrets.AMZ_CREDENTIAL_SECRET }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_IG:   ${{ secrets.BUFFER_CHANNEL_IG }}
          BUFFER_CHANNEL_TIKTOK: ${{ secrets.BUFFER_CHANNEL_TIKTOK }}
          MEDIA_BASE_URL:      ${{ secrets.MEDIA_BASE_URL }}
        run: |
          python -m src.pipeline \
            -n "${{ github.event.inputs.n || 4 }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            | tee corrida.log

      - name: Limpiar imágenes viejas
        run: |
          # Buffer descarga la imagen AL PUBLICAR, no al programar.
          # Guardamos 10 días para cubrir cualquier post en cola.
          find docs/media -name '*.png' -mtime +10 -delete 2>/dev/null || true

      - name: Commit de estado, imágenes y link-in-bio
        run: |
          git config user.name  "ofertas-sin-fin-bot"
          git config user.email "actions@github.com"
          git add data/ docs/ || true
          git diff --staged --quiet || git commit -m "🤖 corrida $(date -u +%Y-%m-%d)"
          git push

      - name: Avisar si el refresh token de ML rotó
        if: steps.pipeline.outputs.ml_new_refresh_token != ''
        run: |
          echo "::warning::MercadoLibre rotó el refresh token."
          echo "Actualiza el secret ML_REFRESH_TOKEN o el sistema muere en 6 h."

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Corrida $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo '```'
            tail -25 corrida.log 2>/dev/null || echo "sin log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
